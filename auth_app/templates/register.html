{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'CSS/auth.css' %}">
</head>
<body>
    <div class="container">
        <h2>Registration</h2>
        <form id="registration-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username:</label>
                {{ form.username }}
                <span class="error-message" id="username-error"></span>
            </div>
            <div class="form-group">
                <label for="id_contact_number">Contact number:</label>
                {{ form.contact_number }}
                <span class="error-message" id="contact-number-error"></span>
            </div>
            <button type="button" id="register-btn">Register</button>
        </form>
        <p class="login-link">Already have an account? <a href="{% url 'auth_app:login' %}">Login here</a></p>
        <p class="login-link explore-link" style="margin-bottom: 5px;">Explore Website <a href="{% url 'store_app:allProdCat' %}">Explore here</a></p>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal hidden">
        <div class="modal-content">
            <p>Please confirm your contact number.</p>
            <button id="confirm-btn">Confirm</button>
            <button id="cancel-btn">Cancel</button>
        </div>
    </div>

    <script>
        document.getElementById('register-btn').addEventListener('click', async function () {
            const form = document.getElementById('registration-form');
            const formData = new FormData(form);
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            // Reset error messages
            document.getElementById('username-error').textContent = '';
            document.getElementById('contact-number-error').textContent = '';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                    },
                    body: formData,
                });
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.redirect_url;
                } else if (data.errors) {
                    if (data.errors.username) {
                        document.getElementById('username-error').textContent = data.errors.username;
                    }
                    if (data.errors.contact_number) {
                        document.getElementById('contact-number-error').textContent = data.errors.contact_number;
                    }
                } else if (data.error) {
                    alert(`An unexpected error occurred: ${data.error}`);
                }
            } catch (error) {
                alert('An unexpected error occurred. Please try again later.');
            }
        });

        // Modal logic
        const modal = document.getElementById('confirmation-modal');
        const confirmBtn = document.getElementById('confirm-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        confirmBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            document.getElementById('registration-form').submit();
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });
    </script>
</body>
</html>
