{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'CSS/auth.css' %}">
</head>
<body>
    <div class="container">
        <h2>Registration</h2>
        <form action="" method="post" id="registration-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username:</label>
                {{ form.username }}
                <span class="error-message" id="username-error"></span>
            </div>
            <div class="form-group">
                <label for="id_contact_number">Contact number:</label>
                {{ form.contact_number }}
                <span class="error-message" id="contact-number-error"></span>
            </div>
            <input type="submit" value="Register">
        </form>
        <p class="login-link">Already have an account? <a href="{% url 'auth_app:login' %}">Login here</a></p>
        <p class="login-link explore-link">Explore Website <a href="{% url 'store_app:allProdCat' %}">Explore here</a></p>
    </div>
    
    {% if form.errors %}
    <script>
        alert("{{ form.errors.as_text|escapejs }}");
    </script>
    {% endif %}

    <script>
    document.getElementById('registration-form').addEventListener('submit', function(event) {
        event.preventDefault();
        let isValid = true;
        const username = document.getElementById('id_username').value;
        const contactNumber = document.getElementById('id_contact_number').value;

        // Validate username
        if (!/^[a-zA-Z]{3,}$/.test(username)) {
            document.getElementById('username-error').textContent = 'Username must be at least 3 characters long and contain only letters.';
            isValid = false;
        } else {
            document.getElementById('username-error').textContent = '';
        }

        // Validate contact number
        if (!/^[0-9]{10,12}$/.test(contactNumber)) {
            document.getElementById('contact-number-error').textContent = 'Contact number must be 10 or 12 digits.';
            isValid = false;
        } else {
            document.getElementById('contact-number-error').textContent = '';
        }

        if (isValid) {
            const confirmation = confirm(`Please confirm your contact number: ${contactNumber}`);
            if (confirmation) {
                this.submit();
            }
        }
    });
    </script>
</body>
</html>
