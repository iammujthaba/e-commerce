{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{% static 'CSS/admin_dashboard.css' %}">
    <style>
        .sidebar li.active {
            background-color: black;
        }
        .sidebar li.active a {
            color: white;
        }
        .dropdown-content {
            display: none; /* Dropdown is hidden by default */
            list-style: none;
            padding-left: 0;
        }
        .dropdown-content li {
            padding-left: 20px;
        }
        .dropdown-btn {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <ul class="sidebar">
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:dashboard' %}">Dashboard</a>
            </li>

            <!-- Manage Dropdown -->
            <li style="padding: 0px;">
                <a style="padding: 20px;" class="dropdown-btn">Manage &#9662;</a>
                <ul class="dropdown-content">
                    <li class="{% if request.resolver_match.url_name == 'category_list' %}active{% endif %}">
                        <a style="padding: 20px;" href="{% url 'admin_app:category_list' %}">Categories Manage</a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                        <a style="padding: 20px;" href="{% url 'admin_app:product_list' %}">Products Manage</a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'shipping_rate_list' %}active{% endif %}">
                        <a style="padding: 20px;" href="{% url 'admin_app:shipping_rate_list' %}">Shipping Cost Manage</a>
                    </li>
                </ul>
            </li>

            <!-- Other Links -->
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'placed_orders' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:placed_orders' %}">New Orders</a>
            </li>
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'confirmed_orders' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:confirmed_orders' %}">Confirmed Orders</a>
            </li>
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'shipped_orders' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:shipped_orders' %}">Shipped Orders</a>
            </li>
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'completed_orders' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:completed_orders' %}">Completed Orders</a>
            </li>
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'admin_payment_status' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:admin_payment_status' %}">payment status</a>
            </li>
            <li style="padding: 0px;" class="{% if request.resolver_match.url_name == 'users_list' %}active{% endif %}">
                <a style="padding: 20px;" href="{% url 'admin_app:users_list' %}">Users List</a>
            </li>
            <li style="padding: 0px;">
                <a style="padding: 20px;" href="{% url 'store_app:allProdCat' %}">Site Panel</a>
            </li>
        </ul>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- JavaScript to Toggle Dropdown -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const dropdownBtn = document.querySelector(".dropdown-btn");
            const dropdownContent = document.querySelector(".dropdown-content");

            dropdownBtn.addEventListener("click", function() {
                if (dropdownContent.style.display === "none" || dropdownContent.style.display === "") {
                    dropdownContent.style.display = "block";
                    dropdownBtn.innerHTML = "Manage &#9652;"; // Change arrow to up
                } else {
                    dropdownContent.style.display = "none";
                    dropdownBtn.innerHTML = "Manage &#9662;"; // Change arrow to down
                }
            });
        });
    </script>
</body>
</html>
