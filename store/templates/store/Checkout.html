{% extends 'store/Base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'assets/css/style/store/checkout.css' %}">

<div class="container checkout-wrapper">
    <div class="checkout-container">
        <div class="checkout-header">
            <h2 class="mb-0">Shipping Information</h2>
        </div>
        <form id="checkout-form" method="POST" action="{% url 'store_app:checkout' %}">
            {% csrf_token %}
            
            <!-- Display error message if fields are empty -->
            {% if messages %}
                <div id="popup-message-container" class="popup-message-container"></div>

                <script>
                    var messagesData = {{ messages|safe }};
                </script>
            {% endif %}
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="contact-number" class="form-label">Contact Number</label>
                    <div class="margin_bott">
                        <input type="tel" class="form-control" id="contact-number" name="number" value="{{ last_shipping.number|default:customer_number }}" required>
                        <span class="text-danger small" id="contact-number-error"></span> 
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="whatsapp-number" class="form-label">WhatsApp Number</label>
                    <div class="margin_bott">                            
                        <input type="tel" class="form-control" id="whatsapp-number" name="whatsapp" value="{{ last_shipping.whatsapp|default:customer_number }}" required>
                        <span class="text-danger small" id="whatsapp-number-error"></span>
                    </div>
                </div>
                <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <div class="margin_bott">                            
                        <input type="text" class="form-control" id="address" name="address" value="{{ last_shipping.address|default:'' }}" required>
                        <span class="text-danger small" id="address-error"></span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <div class="margin_bott">
                        <input type="text" class="form-control" id="city" name="city" value="{{ last_shipping.city|default:'' }}" required>
                        <span class="text-danger small" id="city-error"></span>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <label for="state" class="form-label">State</label>
                    <div class="margin_bott">
                        <select class="form-control" id="state" name="state" required>
                            {% if last_shipping.state and last_shipping.state != 'Other' %}
                                <option value="{{ last_shipping.state }}" selected>{{ last_shipping.state }}</option>
                                {% for state in all_states %}
                                    {% if state != last_shipping.state %}
                                        <option value="{{ state }}" {% if state == selected_state %}selected{% endif %}>{{ state }}</option>
                                    {% endif %}
                                {% endfor %}
                                <option value="Other" {% if selected_state == 'Other' %}selected{% endif %}>Other</option>
                            {% else %}
                                <option value="" disabled selected>Select a state</option>
                                    {% for state in all_states %}
                                        <option value="{{ state }}" {% if state == selected_state %}selected{% endif %}>{{ state }}</option>
                                    {% endfor %}
                                <option value="Other" {% if selected_state == 'Other' %}selected{% endif %}>Other</option>
                            {% endif %}
                            </select>
                        <span class="text-danger small" id="state-error"></span>
                    </div>
                </div>
                <div class="col-md-2">
                    <label for="zipcode" class="form-label">Zip Code</label>
                    <div class="margin_bott">
                        <input type="text" class="form-control" id="zipcode" name="zipcode" value="{{ last_shipping.zipcode|default:'' }}" required>
                        <span class="text-danger small" id="zipcode-error"></span>
                    </div>
                </div>    
            </div>                
            <div class="row2 d-grid gap-2 mt-4">

                <input id="form-button" class="btn btn-success btn-block" type="submit" value="Continue">
                <a href="{% url 'store_app:cart' %}" class="btn btn-light w-100 mt-4 border rounded">Back to Cart</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.getElementById('checkout-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form submission
    
        // Clear existing error messages
        document.querySelectorAll('.text-danger').forEach(el => el.textContent = '');
    
        // Retrieve input values
        const contactNumber = document.getElementById('contact-number').value.trim();
        const whatsappNumber = document.getElementById('whatsapp-number').value.trim();
        const address = document.getElementById('address').value.trim();
        const city = document.getElementById('city').value.trim();
        const state = document.getElementById('state').value;
        const zipcode = document.getElementById('zipcode').value.trim();
    
        // Validation patterns
        const phoneRegex = /^[0-9]{10,15}$/; // Phone number: 10-15 digits
        const zipcodeRegex = /^[0-9]{5,10}$/; // Zipcode: 5-10 digits
    
        // Track form validity
        let isValid = true;
    
        // Contact Number Validation
        if (!phoneRegex.test(contactNumber)) {
            document.getElementById('contact-number-error').textContent = "Contact number must be 10-15 digits.";
            isValid = false;
        }
    
        // WhatsApp Number Validation
        if (!phoneRegex.test(whatsappNumber)) {
            document.getElementById('whatsapp-number-error').textContent = "WhatsApp number must be 10-15 digits.";
            isValid = false;
        }
    
        // Address Validation
        if (address.length < 5) {
            document.getElementById('address-error').textContent = "Address must be at least 8 characters.";
            isValid = false;
        }
    
        // City Validation
        if (city.length < 2) {
            document.getElementById('city-error').textContent = "City must be at least 2 characters.";
            isValid = false;
        }
    
        // State Validation
        if (!state) {
            document.getElementById('state-error').textContent = "Please select a state.";
            isValid = false;
        }
    
        // Zip Code Validation
        if (!zipcodeRegex.test(zipcode)) {
            document.getElementById('zipcode-error').textContent = "Zipcode must be 5-10 digits.";
            isValid = false;
        }
    
        // Submit the form if all inputs are valid
        if (isValid) {
            this.submit();
        }
    });
</script>           
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

{% endblock content %}
